<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GitFlow Manager">
  <!-- 모든 아이콘(192·512·maskable·apple-touch·favicon)의 유일한 원본.
       색이나 모양을 바꾸면 `npm run icons` 로 전부 다시 뽑는다. -->
  <rect width="64" height="64" rx="14" fill="#0e1116"/>

  <!-- git-flow 의 갈래: main 줄기에서 갈라져 나갔다가 되돌아오는 feature -->
  <path d="M20 26C20 26 40 25 40 32C40 39 20 38 20 38"
        fill="none" stroke="#3fb950" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M20 13V51" fill="none" stroke="#4c8dff" stroke-width="4" stroke-linecap="round"/>

  <!-- 분기점·병합점은 줄기 위에, 브랜치 팁은 바깥에 -->
  <circle cx="20" cy="26" r="4.6" fill="#4c8dff"/>
  <circle cx="20" cy="38" r="4.6" fill="#4c8dff"/>
  <circle cx="43" cy="32" r="5" fill="#0e1116"/>
  <circle cx="43" cy="32" r="4.6" fill="#3fb950"/>
</svg>
